# Some basic things
unbind C-b
set -g prefix C-a
bind r source-file ~/.tmux.conf
set -g base-index 1
set -g mouse on
set -g default-terminal "screen-256color"
set -g allow-rename off

# Moving between windows
bind -n M-Left  previous-window
bind -n M-Right next-window

# Moving windows around (windows order)
bind -n M-S-Left swap-window -t -1
bind -n M-S-Right swap-window -t +1

# Moving between panes with arrow keys
bind -n C-S-Left select-pane -L
bind -n C-S-Right select-pane -R
bind -n C-S-Up select-pane -U
bind -n C-S-Down select-pane -D

# Splitting windows - keeping original CWD + using current CWD (by adding a
# shift key)
bind '-' split-window -v
bind '_' split-window -v -c "#{pane_current_path}"
bind '\' split-window -h
bind '|' split-window -h -c "#{pane_current_path}"


# Status bar
set -g status-bg black
set -g status-fg white
set -g status-justify left
set -g status-left '#S'
set -g status-left-fg white
set -g status-right ''
set -g window-status-separator " | "
set -g window-status-fg black
set -g window-status-bg white
set -g window-status-current-fg white
set -g window-status-current-bg red
set -g window-status-current-attr bold

# Sessions list
set -g mode-fg white
set -g mode-bg red
set -g mode-attr bold

# new window keeping CWD
bind C new-window -c "#{pane_current_path}"


##############################################################################
# Support for nesting (see #tmux-nesting)
##############################################################################

bind -T root M-Up  \
  set prefix None \;\
  set key-table off \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S \;\
  set window-status-current-style fg=white,bg=blue \;\
  set window-status-current-format "[\^\^\^ #W \^\^\^]"


bind -T off M-down \
  set -u prefix \;\
  set -u key-table \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S \;\
